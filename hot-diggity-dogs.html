
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Hot Diggity Dogs — October 11, 2026, 12:00 PM to 5:00 PM."
    />
    <title>Hot Diggity Dogs</title>
    <style>
      :root {
        --mustard: #f4bf35;
        --ketchup: #d84a32;
        --ink: #231c18;
        --cream: #fff8eb;
      }

      * { box-sizing: border-box; }

      html { background: var(--cream); }

      body {
        margin: 0;
        min-height: 100vh;
        color: var(--ink);
        font-family: Georgia, "Times New Roman", serif;
        background:
          radial-gradient(circle at 4% 8%, rgba(244, 191, 53, .25) 0 5.5rem, transparent 5.6rem),
          radial-gradient(circle at 96% 94%, rgba(216, 74, 50, .14) 0 8rem, transparent 8.1rem),
          var(--cream);
      }

      main {
        width: min(1040px, calc(100% - 2rem));
        min-height: 100vh;
        margin: 0 auto;
        padding: clamp(1.25rem, 4vw, 3.5rem) 0;
        display: grid;
        place-items: center;
      }

      .poster {
        width: 100%;
        max-width: 900px;
        overflow: hidden;
        border: 3px solid var(--ink);
        border-radius: 3px;
        box-shadow: 10px 10px 0 var(--ink), 17px 17px 0 var(--ketchup);
        background: var(--cream);
      }

      header {
        padding: clamp(2.5rem, 7vw, 5.4rem) clamp(1.5rem, 7vw, 5.5rem) 2.3rem;
        text-align: center;
        background: var(--mustard);
        border-bottom: 3px solid var(--ink);
      }

      .eyebrow, .time-label {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        font-size: .76rem;
        font-weight: 800;
        letter-spacing: .2em;
        text-transform: uppercase;
      }

      .eyebrow::before, .eyebrow::after {
        content: "✦";
        display: inline-block;
        margin: 0 .75rem;
        color: var(--ketchup);
      }

      h1 {
        max-width: 700px;
        margin: .5rem auto 0;
        font-size: clamp(4rem, 13vw, 8.8rem);
        line-height: .77;
        letter-spacing: -.075em;
        text-transform: uppercase;
        text-shadow: 4px 4px 0 var(--cream);
      }

      h1 span { display: block; }

      .dog {
        display: block;
        width: min(420px, 78vw);
        height: auto;
        margin: 1.9rem auto -3.6rem;
      }

      .details {
        display: grid;
        grid-template-columns: 1fr 1fr 1.25fr;
        background: var(--ketchup);
        color: var(--cream);
      }

      .detail {
        min-height: 175px;
        padding: 2.5rem 1.5rem 2rem;
        display: grid;
        align-content: center;
        text-align: center;
      }

      .detail + .detail { border-left: 3px solid var(--ink); }

      .detail time {
        display: block;
        margin-top: .5rem;
        font-size: clamp(1.65rem, 4vw, 2.75rem);
        font-weight: 700;
        line-height: 1.05;
      }

      .detail address {
        display: block;
        margin-top: .5rem;
        font-size: clamp(1.15rem, 2.7vw, 1.65rem);
        font-style: normal;
        font-weight: 700;
        line-height: 1.15;
      }

      .map-link {
        color: inherit;
        text-decoration-color: var(--mustard);
        text-decoration-thickness: 2px;
        text-underline-offset: .22em;
      }

      .map-link:hover, .map-link:focus-visible { color: var(--mustard); }

      .menu {
        padding: clamp(2rem, 5vw, 3.3rem) clamp(1.5rem, 7vw, 5.5rem);
        border-bottom: 3px solid var(--ink);
        text-align: center;
        background: #fffdf7;
      }

      .menu h2 {
        display: inline-block;
        margin: 0 0 1.25rem;
        padding: .4rem .75rem;
        color: var(--cream);
        font-family: Arial, Helvetica, sans-serif;
        font-size: .78rem;
        font-weight: 800;
        letter-spacing: .16em;
        text-transform: uppercase;
        background: var(--ink);
        transform: rotate(-1.5deg);
      }

      .menu-grid {
        display: flex;
        align-items: stretch;
        justify-content: center;
        width: min(620px, 100%);
        margin: 0 auto;
        padding: 0;
      }

      .menu-group {
        flex: 1 1 0;
        padding: .25rem clamp(.8rem, 4vw, 2.5rem);
      }

      .menu-group + .menu-group { border-left: 2px solid var(--ink); }

      .menu-label {
        margin: 0 0 .7rem;
        font-family: Arial, Helvetica, sans-serif;
        font-size: .72rem;
        font-weight: 800;
        letter-spacing: .15em;
        text-transform: uppercase;
      }

      .prices {
        display: flex;
        justify-content: center;
        margin: 0;
      }

      .price {
        min-width: 84px;
        margin: 0;
        padding: .1rem 1rem;
        font-size: clamp(1rem, 2.2vw, 1.2rem);
        font-weight: 700;
        line-height: 1.15;
      }

      .price + .price { border-left: 2px solid var(--mustard); }

      .price strong {
        display: block;
        margin-bottom: .2rem;
        color: var(--ketchup);
        font-size: 1.7em;
      }

      .dog-options {
        margin: 0;
        font-size: clamp(1rem, 2.2vw, 1.22rem);
        font-weight: 700;
        line-height: 1.45;
      }

      footer {
        padding: clamp(2rem, 5vw, 3.3rem) 1.5rem;
        text-align: center;
      }

      footer p {
        margin: 0 0 1.3rem;
        font-size: clamp(1.25rem, 2.8vw, 1.8rem);
        font-style: italic;
      }

      .button {
        display: inline-block;
        padding: .9rem 1.3rem;
        border: 2px solid var(--ink);
        border-radius: 999px;
        color: var(--cream);
        font-family: Arial, Helvetica, sans-serif;
        font-size: .82rem;
        font-weight: 800;
        letter-spacing: .08em;
        text-decoration: none;
        text-transform: uppercase;
        background: var(--ink);
        transition: transform .15s ease, background .15s ease, color .15s ease;
      }

      .button:hover, .button:focus-visible {
        color: var(--ink);
        background: var(--mustard);
        transform: translateY(-3px);
      }

      .button:focus-visible { outline: 3px solid var(--ketchup); outline-offset: 4px; }

      @media (max-width: 680px) {
        .details { grid-template-columns: 1fr; }
        .detail { min-height: 130px; }
        .detail + .detail { border-top: 3px solid var(--ink); border-left: 0; }
        .menu-grid { display: block; }
        .menu-group + .menu-group { margin-top: 1.2rem; padding-top: 1.2rem; border-top: 2px solid var(--ink); border-left: 0; }
      }
    </style>
  </head>
  <body>
    <main>
      <article class="poster">
        <header>
          <p class="eyebrow">A day for the classics</p>
          <h1><span>Hot Diggity</span><span>Dogs</span></h1>
          <svg class="dog" viewBox="0 0 520 135" role="img" aria-label="Illustration of a hot dog">
            <path d="M19 68c0-29 24-53 53-53h376c29 0 53 24 53 53s-24 53-53 53H72C43 121 19 97 19 68Z" fill="#e2a45d" stroke="#231c18" stroke-width="5"/>
            <path d="M54 68c0-19 15-34 34-34h344c19 0 34 15 34 34s-15 34-34 34H88C69 102 54 87 54 68Z" fill="#d84a32" stroke="#231c18" stroke-width="5"/>
            <path d="M96 70c21-22 42 22 63 0s42 22 63 0 42 22 63 0 42 22 63 0 42 22 63 0" fill="none" stroke="#f4bf35" stroke-linecap="round" stroke-width="12"/>
          </svg>
        </header>
        <section class="details" aria-label="Event details">
          <div class="detail">
            <p class="time-label">Date</p>
            <time datetime="2026-10-11">October 11, 2026</time>
          </div>
          <div class="detail">
            <p class="time-label">Time</p>
            <time datetime="2026-10-11T12:00">12:00 PM – 5:00 PM</time>
          </div>
          <div class="detail">
            <p class="time-label">Find us at</p>
            <address>
              <a class="map-link" href="https://www.google.com/maps/search/?api=1&amp;query=25+Ledge+Rock+Way%2C+Acton%2C+MA+01720" target="_blank" rel="noopener">
                NARA Park<br />25 Ledge Rock Way<br />Acton, MA 01720
              </a>
            </address>
          </div>
        </section>
        <section class="menu" aria-labelledby="menu-heading">
          <h2 id="menu-heading">The good stuff</h2>
          <div class="menu-grid">
            <section class="menu-group" aria-labelledby="prices-heading">
              <p class="menu-label" id="prices-heading">Prices</p>
              <div class="prices">
                <p class="price"><strong>$4</strong>for 1</p>
                <p class="price"><strong>$6</strong>for 2</p>
              </div>
            </section>
            <section class="menu-group" aria-labelledby="options-heading">
              <p class="menu-label" id="options-heading">Options for Everyone</p>
              <p class="dog-options">Beef<br />Chicken/Pork</p>
            </section>
          </div>
        </section>
        <footer>
          <p>Come say hello.</p>
          <a class="button" href="mailto:sacha@sachavogel.com">Contact Hot Diggity Dogs</a>
        </footer>
      </article>
    </main>
  </body>
</html>
