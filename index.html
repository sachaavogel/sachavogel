<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sacha Vogel</title>
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="favicon.ico" type="image/x-icon">
      <style>
        body {
          background-color: #67a12d;
        }
      </style>
</head>
<body>

    <h1 class="lsoh">Sacha Vogel</h1>
    <h2 class="lsoh>Hi, I'm Sacha!</h2>
    <h3 class="lsoh">Happy Little Shop of Horrors Day!</h3>
    <p class="lsoh-p"><On the twenty-first (twenty-third) day of the month of September <br>
                          In an early year of a decade not too long before our own <br>
                          The human race suddenly encountered a deadly <br>
                          Threat to its very existence <br>
                          And this terrifying enemy surfaced <br>
                          As such enemies often do In the seemingly most innocent and unlikely of places!</p>

    <!-- little shop day -->
    <img src="https://littleshopnyc.com/_img/audrey-chomp.gif", width=250>
    <script>
  const quotes = ["Feed me & you'll GIT IT", "Don't it go to show ya never know!", "Don't feed the plants!", "When I was younger, just a bad little kid!"];
  setInterval(() => {
    let div = document.createElement('div');
    div.innerText = quotes[Math.floor(Math.random() * quotes.length)];
    div.style = "position:fixed; background:#2e7d32; color:white; width:100px; height:100px; border-radius:50%; display:flex; align-items:center; justify-content:center; text-align:center; padding:10px; font-weight:bold; cursor:pointer; top:" + Math.random()*80 + "%; left:" + Math.random()*80 + "%; z-index:9999;";

    div.onclick = () => div.remove();
    
    document.body.appendChild(div);
    setTimeout(() => div.remove(), 10000);
  }, 6000);
</script>

</div>
<!--end lsoh day -->
  
</body>
</html>
